name: CI Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker compose up -d
    - run: |
        timeout=60
        while [ $timeout -gt 0 ]; do
          curl -f http://localhost:8080 >/dev/null 2>&1 && break
          sleep 2; timeout=$((timeout-2))
        done
    - run: docker compose exec -T web composer install --no-progress
    - run: docker compose exec -T web composer test
    - if: always()
      run: docker compose down -v