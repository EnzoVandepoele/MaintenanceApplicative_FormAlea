services:
  web:
    build: ./php
    container_name: php_apache
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ./src:/var/www/html
    working_dir: /app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: app
      DB_USER: app
      DB_PASS: apppass

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  db_data:
